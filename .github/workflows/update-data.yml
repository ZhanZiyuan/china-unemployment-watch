name: Update official employment data

on:
  schedule:
    - cron: "17 3 * * *"
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      backfill:
        description: Replay collection for the initial historical window
        type: boolean
        default: false

concurrency:
  group: employment-data-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  update:
    if: >-
      github.actor != 'github-actions[bot]' &&
      (github.ref == 'refs/heads/main' ||
       (github.event_name == 'workflow_dispatch' &&
        (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/feature/multidimensional-employment')))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
          persist-credentials: ${{ github.ref == 'refs/heads/main' }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Collect the staged snapshot
        id: collect
        continue-on-error: true
        env:
          BACKFILL: ${{ inputs.backfill }}
        run: |
          if [[ "$BACKFILL" == true ]]; then
            pnpm fetch-data --backfill
          else
            pnpm fetch-data
          fi
      - name: Restore the last validated core snapshot after a failed refresh
        if: steps.collect.outcome == 'failure'
        run: |
          git restore --source=HEAD --worktree -- data/metadata/releases.json data/processed/observations.json \
            public/data/latest.json public/data/manifest.json
          if git ls-files --error-unmatch data/revisions/observations.json >/dev/null 2>&1; then
            git restore --source=HEAD --worktree -- data/revisions/observations.json
          elif [[ -f data/revisions/observations.json ]]; then
            rm -- data/revisions/observations.json
          fi
      - name: Refresh independent research sources and rerun archived model folds
        id: research
        env:
          BACKFILL: ${{ inputs.backfill }}
          CORE_RESULT: ${{ steps.collect.outcome }}
        run: |
          args=()
          if [[ "$BACKFILL" == true ]]; then args+=(--backfill); fi
          if [[ "$CORE_RESULT" != success ]]; then args+=(--core-failed); fi
          pnpm fetch-research "${args[@]}"
          pnpm build-research-models
          result=$(jq -er .result public/data/research-collection-status.json)
          echo "result=$result" >> "$GITHUB_OUTPUT"
          if [[ "$result" != success ]]; then
            echo "::warning::Research availability is $result. See the research collection artifact."
          fi
      - name: Check the application against the candidate data
        run: |
          pnpm validate-data
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm build
      - name: Store collection logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: collection-${{ github.run_id }}-${{ github.run_attempt }}
          path: data/runs
          if-no-files-found: ignore
      - name: Commit the approved paths
        id: commit
        if: github.ref == 'refs/heads/main'
        env:
          RESULT: ${{ steps.collect.outcome }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ "$RESULT" == success ]]; then
            git add -- data/metadata/releases.json data/processed/observations.json \
              public/data/latest.json public/data/manifest.json
            if [[ -f data/revisions/observations.json ]]; then
              git add -- data/revisions/observations.json
            fi
          fi
          git add -- data/metadata/research-releases.json public/data/research.json \
            public/data/research-models.json public/data/research-collection-status.json
          while read -r hash; do
            [[ "$hash" =~ ^[a-f0-9]{64}$ ]] || exit 1
            archive="data/raw/$hash.html.gz"
            metadata="data/metadata/$hash.json"
            if ! git ls-files --error-unmatch -- "$archive" "$metadata" >/dev/null 2>&1; then
              git add -- "$archive" "$metadata"
            fi
          done < <(jq -r 'keys[]' data/metadata/releases.json data/metadata/research-releases.json | sort -u)
          if [[ -f public/data/collection-status.json ]]; then
            health_result=$(jq -er .result public/data/collection-status.json)
            if [[ "$RESULT" == success || "$health_result" != success ]]; then
              git add -- public/data/collection-status.json
            fi
          fi
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Publish employment data and collection status" \
            -m "Record the verified snapshot and the latest collection outcome from the main data writer."
          git push origin HEAD:refs/heads/main
          echo "pushed=true" >> "$GITHUB_OUTPUT"
      - name: Request Vercel rebuild when a deploy hook is configured
        if: steps.commit.outputs.pushed == 'true'
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [[ -n "$VERCEL_DEPLOY_HOOK" ]]; then
            curl --fail --silent --output /dev/null --max-time 20 --request POST "$VERCEL_DEPLOY_HOOK"
          fi
      - name: Verify the Vercel data version
        if: steps.commit.outputs.pushed == 'true'
        env:
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL || 'https://cuwatch.vercel.app' }}
        run: node --import tsx scripts/verify-online.ts
      - name: Mark failed collection and notify via GitHub Actions
        if: always() && (steps.collect.outcome == 'failure' || steps.research.outputs.result == 'fetch_failed')
        run: |
          echo "::error::One or more required collection sources failed. Verified data were retained for those sources."
          echo "See the collection artifact for source-specific outcomes." >> "$GITHUB_STEP_SUMMARY"
          exit 1
